<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PNG Route Creator</title>
<style>
  :root {
    --bg: #f3f6f8;
    --surface: #ffffff;
    --ink: #14232e;
    --muted: #5b6b77;
    --line: #d5dee5;
    --accent: #008cff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1a22;
      --surface: #17252f;
      --ink: #e8f0f5;
      --muted: #93a5b2;
      --line: #2a3b47;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.75rem; margin: 8px 0 4px; letter-spacing: -0.01em; }
  p.lead { margin: 0 0 20px; color: var(--muted); }
  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  label.drop {
    display: block;
    border: 2px dashed var(--line);
    border-radius: 10px;
    padding: 28px 12px;
    text-align: center;
    cursor: pointer;
    color: var(--muted);
  }
  label.drop:hover, label.drop:focus-within { border-color: var(--accent); color: var(--ink); }
  input[type=file] { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
  .grid label { display: flex; flex-direction: column; font-size: 0.875rem; color: var(--muted); gap: 4px; }
  .grid input[type=number] {
    font: inherit; padding: 8px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    width: 100%;
  }
  .grid input[type=color] { width: 100%; height: 40px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); padding: 2px; }
  h2 { font-size: 1rem; margin: 0 0 12px; }
  button, a.btn {
    font: inherit; font-weight: 600;
    background: var(--accent); color: #fff;
    border: 0; border-radius: 8px;
    padding: 12px 18px; cursor: pointer;
    text-decoration: none; display: inline-block;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button:focus-visible, a.btn:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .previews { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .previews figure { margin: 0; }
  .previews figcaption { font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }
  canvas, img.src {
    max-width: 100%; height: auto; border-radius: 6px; display: block;
    border: 1px solid var(--line);
  }
  #outCanvas {
    background-color: #fff;
    background-image:
      linear-gradient(45deg, #d9d9d9 25%, transparent 25%, transparent 75%, #d9d9d9 75%),
      linear-gradient(45deg, #d9d9d9 25%, transparent 25%, transparent 75%, #d9d9d9 75%);
    background-size: 16px 16px;
    background-position: 0 0, 8px 8px;
  }
  #status { color: var(--muted); font-size: 0.9rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>PNG Route Creator</h1>
  <p class="lead">Upload a screenshot and get back a transparent PNG containing only the route line.</p>

  <div class="panel">
    <label class="drop" for="file">
      <span id="dropText">Tap to choose a screenshot (JPG or PNG)</span>
      <input id="file" type="file" accept="image/*">
    </label>
  </div>

  <div class="panel">
    <h2>Settings</h2>
    <div class="grid">
      <label>Red min <input type="number" id="rMin" min="0" max="255" value="0"></label>
      <label>Red max <input type="number" id="rMax" min="0" max="255" value="120"></label>
      <label>Green min <input type="number" id="gMin" min="0" max="255" value="50"></label>
      <label>Green max <input type="number" id="gMax" min="0" max="255" value="180"></label>
      <label>Blue min <input type="number" id="bMin" min="0" max="255" value="120"></label>
      <label>Blue max <input type="number" id="bMax" min="0" max="255" value="255"></label>
      <label>Route colour <input type="color" id="routeColour" value="#008cff"></label>
      <label>Route thickness <input type="number" id="thickness" min="0" max="30" value="4"></label>
    </div>
  </div>

  <div class="panel actions">
    <button id="go" disabled>Create route PNG</button>
    <a class="btn" id="download" hidden>Download PNG</a>
    <span id="status" role="status"></span>
  </div>

  <div class="panel previews" id="previews" hidden>
    <figure>
      <figcaption>Original</figcaption>
      <canvas id="srcCanvas"></canvas>
    </figure>
    <figure>
      <figcaption>Route PNG (checkerboard = transparent)</figcaption>
      <canvas id="outCanvas"></canvas>
    </figure>
  </div>
</main>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const fileInput = $("file"), goBtn = $("go"), dl = $("download"), statusEl = $("status");
  const srcCanvas = $("srcCanvas"), outCanvas = $("outCanvas");
  let img = null, baseName = "image";

  fileInput.addEventListener("change", () => {
    const f = fileInput.files[0];
    if (!f) return;
    baseName = f.name.replace(/\.[^.]+$/, "");
    $("dropText").textContent = f.name;
    const url = URL.createObjectURL(f);
    const im = new Image();
    im.onload = () => {
      img = im;
      srcCanvas.width = im.naturalWidth;
      srcCanvas.height = im.naturalHeight;
      srcCanvas.getContext("2d").drawImage(im, 0, 0);
      $("previews").hidden = false;
      goBtn.disabled = false;
      dl.hidden = true;
      statusEl.textContent = "Image loaded.";
      URL.revokeObjectURL(url);
    };
    im.onerror = () => { statusEl.textContent = "Could not read that image."; };
    im.src = url;
  });

  // Same as scipy binary_dilation default (cross-shaped, 4-connected), repeated n times
  function dilate(mask, w, h, n) {
    let cur = mask;
    for (let i = 0; i < n; i++) {
      const next = new Uint8Array(cur);
      for (let y = 0; y < h; y++) {
        const row = y * w;
        for (let x = 0; x < w; x++) {
          const p = row + x;
          if (cur[p]) continue;
          if ((x > 0 && cur[p - 1]) || (x < w - 1 && cur[p + 1]) ||
              (y > 0 && cur[p - w]) || (y < h - 1 && cur[p + w])) {
            next[p] = 1;
          }
        }
      }
      cur = next;
    }
    return cur;
  }

  function hexToRgb(hex) {
    return [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
  }

  goBtn.addEventListener("click", () => {
    if (!img) return;
    statusEl.textContent = "Working…";
    goBtn.disabled = true;
    setTimeout(() => {
      try {
        const w = img.naturalWidth, h = img.naturalHeight;
        const ctx = srcCanvas.getContext("2d");
        const data = ctx.getImageData(0, 0, w, h).data;

        const rMin = +$("rMin").value, rMax = +$("rMax").value;
        const gMin = +$("gMin").value, gMax = +$("gMax").value;
        const bMin = +$("bMin").value, bMax = +$("bMax").value;
        const thick = Math.max(0, +$("thickness").value | 0);
        const [cr, cg, cb] = hexToRgb($("routeColour").value);

        const mask = new Uint8Array(w * h);
        for (let i = 0, p = 0; p < mask.length; p++, i += 4) {
          const r = data[i], g = data[i + 1], b = data[i + 2];
          if (r >= rMin && r <= rMax && g >= gMin && g <= gMax && b >= bMin && b <= bMax) mask[p] = 1;
        }

        const thickMask = dilate(mask, w, h, thick);

        outCanvas.width = w;
        outCanvas.height = h;
        const octx = outCanvas.getContext("2d");
        const out = octx.createImageData(w, h);
        for (let p = 0, i = 0; p < thickMask.length; p++, i += 4) {
          if (thickMask[p]) {
            out.data[i] = cr; out.data[i + 1] = cg; out.data[i + 2] = cb; out.data[i + 3] = 255;
          }
        }
        octx.putImageData(out, 0, 0);

        outCanvas.toBlob((blob) => {
          if (dl.dataset.url) URL.revokeObjectURL(dl.dataset.url);
          const url = URL.createObjectURL(blob);
          dl.dataset.url = url;
          dl.href = url;
          dl.download = baseName + "_route.png";
          dl.hidden = false;
          statusEl.textContent = "Done. Saved as " + baseName + "_route.png";
          goBtn.disabled = false;
        }, "image/png");
      } catch (e) {
        statusEl.textContent = "Something went wrong: " + e.message;
        goBtn.disabled = false;
      }
    }, 30);
  });
})();
</script>
</body>
</html>
